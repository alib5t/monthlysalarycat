
workflows:
  android-apk:
    name: Android APK
    max_build_duration: 60
    instance_type: linux_x2

    environment:
      flutter: stable

    scripts:
      - name: Get Flutter packages
        script: flutter pub get

      - name: Build Android APK
        script: flutter build apk --release

    artifacts:
      - build/app/outputs/flutter-apk/*.apk

  ios-app:
    name: iOS APP Unsigned
    max_build_duration: 120
    instance_type: mac_mini_m2

    environment:
      flutter: stable
      xcode: latest

    scripts:
      - name: Get Flutter packages
        script: flutter pub get

      - name: Build unsigned iOS APP
        script: flutter build ios --release --no-codesign

    artifacts:
      - build/ios/iphoneos/**/*.app
      - /tmp/xcodebuild_logs/*.log

  windows-exe:
    name: Windows EXE
    max_build_duration: 60
    instance_type: windows_x2

    environment:
      flutter: stable

    scripts:
      - name: Get Flutter packages
        script: flutter pub get

      - name: Enable Windows desktop
        script: flutter config --enable-windows-desktop

      - name: Build Windows EXE
        script: flutter build windows --release

      - name: Package Windows application
        script: |
          cd build/windows/x64/runner/Release
          7z a -r ../VideoApp-Windows.zip ./*

    artifacts:
      - build/windows/x64/runner/Release/*.exe
      - build/windows/x64/runner/VideoApp-Windows.zip
