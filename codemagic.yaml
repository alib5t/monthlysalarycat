```yaml
workflows:
  windows-build:
    name: Windows EXE Build
    instance_type: mac_mini_m2

    max_build_duration: 60

    environment:
      flutter: stable

    scripts:
      - name: Get Flutter packages
        script: flutter pub get

      - name: Build Windows app
        script: flutter build windows --release

      - name: Package Windows app
        script: |
          powershell -Command "Compress-Archive -Path 'build\windows\x64\runner\Release\*' -DestinationPath 'windows-app.zip' -Force"

    artifacts:
      - build/windows/x64/runner/Release/**
      - windows-app.zip
```
