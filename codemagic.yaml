
workflows:
  android-apk:
    name: Build Android APK
    max_build_duration: 120
    instance_type: linux

    environment:
      flutter: stable

    scripts:
      - name: Check Flutter
        script: flutter doctor -v

      - name: Install dependencies
        script: flutter pub get

      - name: Build APK
        script: flutter build apk --release

    artifacts:
      - build/app/outputs/flutter-apk/app-release.apk
